<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/AayamLogoV1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AAYAM - Every Dimension. Connected. | Construction & Real Estate Management</title>
    <meta name="description" content="AAYAM - Construction & Real Estate Management. Connect people, approvals, progress and commitments—from planning to handover. A product of MSquare Software." />
    <meta name="theme-color" content="#F15A24" />
    
    <!-- Preload Brand Logo for Instant Frame-1 Display on Mobile & Refresh -->
    <link rel="preload" as="image" href="/AayamLogoWhite.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      /* Standalone base styles to prevent margin offset before Tailwind initializes */
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
      }

      /* Ultra-fast Frame-1 Logo Splash Screen - 60fps Mobile Hardware Accelerated */
      #initial-splash {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 48%, #0C1A30 0%, #060E1B 65%, #030710 100%);
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        transition: opacity 0.38s cubic-bezier(0.16, 1, 0.3, 1), transform 0.38s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }
      #initial-splash.splash-exit {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }
      .splash-beam-container {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .splash-beam {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: rgba(255, 255, 255, 0.035);
      }
      .splash-beam-glow {
        position: absolute;
        left: 0;
        width: 2px;
        height: 140px;
        background: linear-gradient(to top, rgba(241, 90, 36, 0.8), rgba(241, 90, 36, 0.15), transparent);
        border-radius: 9999px;
        animation: beamRiseAnim 2.2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
        transform: translateZ(0);
      }
      @keyframes beamRiseAnim {
        0% { transform: translateY(105vh); opacity: 0; }
        15% { opacity: 0.9; }
        85% { opacity: 0.9; }
        100% { transform: translateY(-160px); opacity: 0; }
      }
      .splash-aura {
        position: absolute;
        width: min(85vw, 380px);
        height: min(85vw, 380px);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(241, 90, 36, 0.22) 0%, rgba(241, 90, 36, 0.05) 45%, transparent 70%);
        pointer-events: none;
        animation: auraPulseAnim 1.8s ease-in-out infinite alternate;
        transform: translateZ(0);
      }
      @keyframes auraPulseAnim {
        0% { transform: scale(0.92); opacity: 0.65; }
        100% { transform: scale(1.12); opacity: 1; }
      }
      .splash-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        max-width: 440px;
        width: 100%;
        text-align: center;
        margin: 0 auto;
        animation: logoPopAnim 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        transform: translateZ(0);
      }
      @keyframes logoPopAnim {
        0% {
          opacity: 0;
          transform: scale(0.84) translateY(-10px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      .splash-logo-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }
      .splash-logo-img {
        height: 48px;
        max-width: 80vw;
        width: auto;
        object-fit: contain;
        display: block;
        margin: 0 auto;
        filter: drop-shadow(0 12px 28px rgba(241, 90, 36, 0.55)) drop-shadow(0 0 18px rgba(255, 255, 255, 0.25));
      }
      @media (min-width: 640px) {
        .splash-logo-img {
          height: 68px;
        }
      }
      .splash-progress-box {
        margin: 24px auto 0 auto;
        width: 180px;
        max-width: 75vw;
      }
      @media (min-width: 640px) {
        .splash-progress-box {
          margin: 32px auto 0 auto;
          width: 210px;
        }
      }
      .splash-progress-track {
        height: 4px;
        width: 100%;
        background: rgba(15, 23, 42, 0.9);
        border-radius: 9999px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
      }
      .splash-progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #FBBF24 0%, #F15A24 65%, #EA580C 100%);
        border-radius: 9999px;
        box-shadow: 0 0 10px rgba(241, 90, 36, 0.9);
        animation: progressFillAnim 1.1s cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
      }
      @keyframes progressFillAnim {
        0% { width: 0%; }
        45% { width: 60%; }
        80% { width: 90%; }
        100% { width: 100%; }
      }
      .splash-progress-labels {
        margin-top: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.08em;
        color: #94A3B8;
        width: 100%;
      }
      .splash-orange-text {
        color: #F15A24;
        font-weight: 700;
      }
      .splash-tap-hint {
        position: absolute;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.04em;
        color: #94A3B8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        opacity: 0.8;
      }
    </style>
  </head>
  <body class="bg-white text-slate-800 antialiased" ontouchstart="">
    <!-- Immediate Frame-1 Splash Screen for Zero-Delay Logo Display on Mobile & Refresh -->
    <div id="initial-splash" role="status" aria-label="Loading AAYAM">
      <div class="splash-beam-container">
        <div class="splash-beam" style="left: 10%"><div class="splash-beam-glow" style="animation-delay: 0.1s"></div></div>
        <div class="splash-beam" style="left: 28%"><div class="splash-beam-glow" style="animation-delay: 0.7s; height: 180px"></div></div>
        <div class="splash-beam" style="left: 50%"><div class="splash-beam-glow" style="animation-delay: 0.3s; height: 160px"></div></div>
        <div class="splash-beam" style="left: 72%"><div class="splash-beam-glow" style="animation-delay: 0.9s; height: 190px"></div></div>
        <div class="splash-beam" style="left: 90%"><div class="splash-beam-glow" style="animation-delay: 0.4s"></div></div>
      </div>
      <div class="splash-aura"></div>
      <div class="splash-content">
        <div class="splash-logo-wrap">
          <img
            src="/AayamLogoWhite.png"
            alt="AAYAM - Every Dimension. Connected."
            class="splash-logo-img"
          />
        </div>
        <div class="splash-progress-box">
          <div class="splash-progress-track">
            <div class="splash-progress-fill"></div>
          </div>
          <div class="splash-progress-labels">
            <span>INITIALIZING</span>
            <span class="splash-orange-text">100%</span>
          </div>
        </div>
      </div>
      <div class="splash-tap-hint">Tap anywhere to enter</div>
    </div>

    <script>
      (function() {
        var splash = document.getElementById('initial-splash');
        if (!splash) return;
        var dismissed = false;
        function dismiss() {
          if (dismissed) return;
          dismissed = true;
          splash.classList.add('splash-exit');
          setTimeout(function() {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 380);
        }
        window.dismissSplash = dismiss;
        // Fast, elegant splash duration (~1.25s)
        setTimeout(dismiss, 1250);
        splash.addEventListener('click', dismiss);
        splash.addEventListener('touchstart', dismiss, { passive: true });
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
